name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Restore Bun and Turbo caches
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.2.4
        with:
          path: |
            ~/.bun/install/cache
            .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}-

      - name: Build workspace packages
        run: bun run build:packages

      - name: Run independent checks and application builds in parallel
        run: >-
          bunx concurrently --kill-others-on-fail --names code,docs,typecheck,tests,build
          "bun run check:code"
          "bun run check:docs"
          "bun run typecheck:workspace"
          "bun run test:packages && bun run test:unit"
          "bun run build"

      - name: Install Playwright Chromium
        if: github.event_name == 'push'
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run test:e2e

      - name: Upload Worker Preview bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netscry-worker
          path: |
            apps/web/dist/server/**
            apps/web/dist/client/**
          if-no-files-found: error
          retention-days: 7
