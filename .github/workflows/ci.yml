name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code
            command: bun run check:code
          - name: Docs
            command: bun run check:docs
          - name: Typecheck
            command: bun run typecheck:workspace
          - name: Tests
            command: bun run test:packages && bun run test:unit
          - name: Build
            command: bun run build
            uploadArtifact: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run ${{ matrix.name }} checks
        run: ${{ matrix.command }}

      - name: Upload Worker Preview bundle
        if: matrix.uploadArtifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netscry-worker
          path: |
            apps/web/dist/server/**
            apps/web/dist/client/**
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: Browser tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run test:e2e
